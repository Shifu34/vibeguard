[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeguard-secrets"
version = "0.2.0"
description = "Stop AI-generated code from shipping secrets and security holes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    'tomli>=2.0; python_version < "3.11"',  # backport of stdlib tomllib
]
license = { text = "MIT" }
authors = [{ name = "Mikey" }]
keywords = ["security", "secrets", "pre-commit", "ai", "llm", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
vibeguard = "vibeguard.cli:main"

[project.urls]
Homepage = "https://github.com/Shifu34/vibeguard"
Issues = "https://github.com/Shifu34/vibeguard/issues"

[tool.setuptools.packages.find]
where = ["src"]
