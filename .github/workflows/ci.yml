name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e . pytest

      - name: Run tests
        run: python -m pytest

  dogfood:
    # VibeGuard scans itself: the repo must stay secret-free (tests/** is
    # allowlisted by default, since fixtures intentionally contain fakes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VibeGuard
        run: pip install -e .

      - name: Scan the repo
        run: vibeguard scan --all
